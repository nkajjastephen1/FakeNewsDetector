<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f4f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            width: 500px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 14px;
            font-size: 15px;
            border-radius: 10px;
            border: 1px solid #ccc;
            outline: none;
            resize: none;
            transition: 0.3s;
        }

        textarea:focus {
            border-color: #0066ff;
            box-shadow: 0 0 5px rgba(0,102,255,0.4);
        }

        button {
            width: 100%;
            padding: 15px;
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }

        button:hover {
            background: #004dcc;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }

        .fake {
            background: #ffdddd;
            color: #cc0000;
        }

        .real {
            background: #ddffdd;
            color: #008800;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>📰 Fake News Detector</h2>

        <form method="POST">
            <textarea name="news_text" placeholder="Paste or type news text here..."></textarea>
            <button type="submit">Analyze News</button>
        </form>

        {% if prediction %}
            <div class="result-box {% if prediction == 'FAKE NEWS' %}fake{% else %}real{% endif %}">
                {{ prediction }}
            </div>
        {% endif %}
    </div>

</body>
</html>
